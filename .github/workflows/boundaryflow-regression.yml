name: BoundaryFlow engine regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - work/engine-regression-suite-v1
  pull_request:
    branches:
      - main

concurrency:
  group: boundaryflow-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-regression:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request candidate
        uses: actions/checkout@v4
        with:
          # This suite validates the candidate branch itself, not GitHub's
          # synthetic merge commit (which can contain stale test harness files
          # while the long-lived branches are being reconciled).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install matching Playwright package
        run: npm install --no-save playwright@1.56.1
      - name: Run isolated engine regression suite
        run: node tests/run-regression.mjs
      - name: Run browser end-to-end workflow review
        run: node tests/run-e2e.mjs
      - name: Upload regression and end-to-end reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundaryflow-engine-regression-results
          path: |
            index.html
            test-results/*
          if-no-files-found: ignore
          retention-days: 14
