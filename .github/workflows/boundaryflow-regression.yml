name: BoundaryFlow engine regression tests

on:
  push:
    branches:
      - work/engine-regression-suite-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  engine-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: npm install --no-save playwright@1.56.1
      - name: Run isolated engine regression suite
        run: node tests/run-regression.mjs
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundaryflow-engine-regression-results
          path: test-results/engine-regression-results.json
          if-no-files-found: ignore
          retention-days: 14
